services:
  haushaltsbuch:
    image: ghcr.io/n0ne117/haushaltsbuch:latest  # or pin a version, e.g. :1.0.0
    build: .  # only used with `docker compose up --build` from a checkout
    container_name: haushaltsbuch
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TZ=Europe/Vienna
      - BACKUP_KEEP_DAYS=14
    volumes:
      - /mnt/user/appdata/haushaltsbuch:/data
