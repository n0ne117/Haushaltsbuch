{#- Entry form, used by quick add (HTMX, swaps itself) and the edit page (plain POST). -#}
{% set edit = edit | default(false) %}
<form id="entry-form" class="entry-form" data-entry-form method="post"
      action="{{ action | default('/entries') }}" autocomplete="off"
      {% if not edit %}hx-post="/entries" hx-swap="outerHTML"{% endif %}>

  {% include "partials/entry_fields.html" %}

  <button class="btn primary block" type="submit">{{ submit_label | default("Speichern") }}</button>
</form>
