{% extends "base.html" %}
{% from "macros.html" import filter_chips %}
{% set tab = "entries" %}
{% block title %}Buchungen · Haushaltsbuch{% endblock %}
{% block content %}
<h1>Buchungen</h1>

<form class="filters" hx-get="/entries/rows" hx-target="#entry-list"
      hx-trigger="change, input from:#q delay:300ms" action="/entries">
  <input id="q" type="search" name="q" value="{{ filters.q }}" placeholder="In Notizen suchen …" aria-label="Suche">
  <details {% if filters.account_ids or filters.tag_ids %}open{% endif %}>
    <summary>Filter</summary>
    {{ filter_chips(accounts, tags, filters) }}
    <noscript><button class="btn" type="submit">Anwenden</button></noscript>
  </details>
</form>

<div id="entry-list" class="entry-list">
  {% include "entries/_rows.html" %}
</div>
{% endblock %}
